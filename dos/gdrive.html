<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google Drive Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        #fileList {
            margin-top: 20px;
        }
        .file-item {
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        .file-item:hover {
            background-color: #f5f5f5;
        }
        #status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .error {
            background-color: #fde7e7;
            color: #d32f2f;
        }
        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>Google Drive Test</h1>
    <div id="status"></div>
    <div id="fileList"></div>

    <script>
        // Замените на ваш API ключ
        const API_KEY = 'AIzaSyCTVUfMDmj3fsVYD341-Nen-zO0qXxupDs';
        // ID вашей публичной папки
        const FOLDER_ID = '1rfW-ULXZw255l5kVE4JxW9BlVM-YBVOV';

        // Получаем список файлов при загрузке страницы
        window.onload = listFiles;

        async function listFiles() {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?` +
                    `q='${FOLDER_ID}' in parents` +
                    `&key=${API_KEY}` +
                    `&fields=files(id,name,size,modifiedTime,mimeType)`,
                    {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const files = data.files;

                if (!files || files.length === 0) {
                    document.getElementById('status').textContent = 'Файлы не найдены';
                    document.getElementById('status').className = 'error';
                    return;
                }

                // Показываем файлы
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '<h2>Найденные файлы:</h2>';
                
                files.forEach(file => {
                    const fileSize = formatFileSize(parseInt(file.size));
                    const modifiedDate = new Date(file.modifiedTime).toLocaleString();
                    
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-item';
                    fileDiv.innerHTML = `
                        <strong>${file.name}</strong><br>
                        Размер: ${fileSize}<br>
                        Изменён: ${modifiedDate}<br>
                        ID: ${file.id}<br>
                        Тип: ${file.mimeType}
                    `;
                    fileList.appendChild(fileDiv);
                });

                document.getElementById('status').textContent = `Найдено файлов: ${files.length}`;
                document.getElementById('status').className = 'success';
            } catch (error) {
                document.getElementById('status').textContent = `Ошибка: ${error.message}`;
                document.getElementById('status').className = 'error';
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
