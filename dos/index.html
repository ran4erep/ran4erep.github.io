<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ran4erep's DOS library</title>
    <link rel="stylesheet" href="js-dos/js-dos.css">
    <script src="js-dos/js-dos.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #dos {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="dos"></div>
    <script>
        Dos(document.getElementById("dos"), {
            url: "udoom.jsdos",
            background: "doom.jpg",
            renderAspect: "16/9",
            noCloud: true,
            softKeyboardLayout: [
                [
                    [
                        " w ",
                        "a s d"
                    ],
                    [
                        "{esc}"
                    ],
                    [
                        "1 2 3 4 5 6 7"
                    ],
                    [
                        "e {space} {shift}",
                        "{left} {right}"
                    ]
                ],
            ],
            softKeyboardSymbols: [
                {
                    "w": "↑",
                    "s": "↓",
                    "a": "←",
                    "d": "→",
                    "{left}": "←",
                    "{right}": "→",
                    "e": "Use",
                    "{space}": "Shoot",
                    "{shift}": "Run",
                    "{esc}": "Main menu",
                }
            ]
        });
    </script>
</body>
</html>
