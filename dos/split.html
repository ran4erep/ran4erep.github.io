<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Splitter - ran4erep's DOS Games Library</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .splitter-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 10px;
        }

        .file-input-container {
            margin-bottom: 20px;
        }

        .file-input-label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .size-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            background: var(--secondary-color);
            border: none;
            border-radius: 5px;
            color: var(--text-color);
        }

        .split-button {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: var(--custom-cursor), pointer;
        }

        .split-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: var(--secondary-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            margin-top: 10px;
            color: var(--text-color);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
        }

        .back-button:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="splitter-container">
        <a href="index.html" class="back-button">← Вернуться на главную</a>
        <h2 style="color: var(--text-color); margin-bottom: 20px;">Разделение файла на части</h2>
        
        <div class="file-input-container">
            <label class="file-input-label">Выберите файл для разделения:</label>
            <input type="file" id="fileInput" style="color: var(--text-color);">
        </div>

        <input type="number" id="sizeInput" class="size-input" value="95" placeholder="Размер части в МБ">
        
        <button id="splitButton" class="split-button" disabled>Разделить файл</button>

        <div id="progressContainer" class="progress-container">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const sizeInput = document.getElementById('sizeInput');
        const splitButton = document.getElementById('splitButton');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const status = document.getElementById('status');

        fileInput.addEventListener('change', () => {
            splitButton.disabled = !fileInput.files.length;
        });

        splitButton.addEventListener('click', async () => {
            const file = fileInput.files[0];
            const chunkSize = Math.floor(sizeInput.value * 1024 * 1024); // Конвертируем МБ в байты

            if (!file) return;

            splitButton.disabled = true;
            progressContainer.style.display = 'block';
            
            const totalChunks = Math.ceil(file.size / chunkSize);
            let currentChunk = 0;
            
            // Создаём объект для хранения частей файла
            const chunks = [];
            
            // Читаем файл по частям
            for (let start = 0; start < file.size; start += chunkSize) {
                const chunk = file.slice(start, start + chunkSize);
                chunks.push(chunk);
                currentChunk++;
                
                // Обновляем прогресс
                const progress = (currentChunk / totalChunks) * 100;
                progressFill.style.width = progress + '%';
                status.textContent = `Обработано ${currentChunk} из ${totalChunks} частей...`;
            }

            // Создаём и скачиваем каждую часть
            for (let i = 0; i < chunks.length; i++) {
                const blob = new Blob([chunks[i]], { type: file.type });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `${file.name.replace(/\.[^/.]+$/, '')}_${i + 1}.jsdos`; // Используем .jsdos расширение
                a.click();
                
                URL.revokeObjectURL(url);
                
                // Обновляем статус
                status.textContent = `Сохранение части ${i + 1} из ${chunks.length}...`;
            }

            status.textContent = 'Готово! Все части файла сохранены.';
            splitButton.disabled = false;
        });
    </script>
</body>
</html>
