<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ran4erep's DOS library</title>
    <link rel="stylesheet" href="js-dos/js-dos.css">
    <script src="js-dos/js-dos.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #dos {
            width: 100%;
            height: 100%;
            display: block;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 1000;
        }

        #loading-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(5px);
            opacity: 0.3;
            z-index: 999;
            display: none;
        }

        .progress-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #8b5cf6;
            transition: width 0.2s ease;
            position: relative;
        }

        .progress-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            z-index: 1;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="dos"></div>
    <div id="loading-background"></div>
    <div id="loading">
        <div>Сборка файла игры...</div>
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
            <div id="progressText" class="progress-text">0%</div>
        </div>
        <div id="status"></div>
    </div>
    <script>
        // Получаем путь к папке с игрой из URL
        const urlParams = new URLSearchParams(window.location.search);
        const gamePath = urlParams.get('game');
        
        if (!gamePath) {
            document.body.innerHTML = 'Error: Game path not specified';
            throw new Error('Game path not specified');
        }

        // Загружаем настройки ремаппинга
        const keyMappings = JSON.parse(localStorage.getItem(`remap_${gamePath}`) || '{}');

        // Проверяем, есть ли хоть один ремап
        if (Object.keys(keyMappings).length > 0) {
            // Кэшируем события клавиатуры для каждой кнопки
            const keyboardEvents = {};
            for (const [buttonCode, keyCode] of Object.entries(keyMappings)) {
                keyboardEvents[buttonCode] = {
                    down: new KeyboardEvent('keydown', {
                        code: keyCode,
                        key: keyCode.replace('Key', '').toLowerCase(),
                        keyCode: getKeyCode(keyCode),
                        which: getKeyCode(keyCode),
                        bubbles: true,
                        cancelable: true
                    }),
                    up: new KeyboardEvent('keyup', {
                        code: keyCode,
                        key: keyCode.replace('Key', '').toLowerCase(),
                        keyCode: getKeyCode(keyCode),
                        which: getKeyCode(keyCode),
                        bubbles: true,
                        cancelable: true
                    })
                };
            }

            // Обработчик нажатия клавиш
            document.addEventListener('keydown', (e) => {
                if (keyMappings[e.code]) {
                    e.preventDefault();
                    document.dispatchEvent(keyboardEvents[e.code].down);
                }
            });

            // Обработчик отпускания клавиш
            document.addEventListener('keyup', (e) => {
                if (keyMappings[e.code]) {
                    e.preventDefault();
                    document.dispatchEvent(keyboardEvents[e.code].up);
                }
            });

            // Добавляем обработчик событий геймпада
            let isPolling = false;
            const pressedButtons = new Set();
            const STICK_THRESHOLD = 0.5;

            // Кэшируем ссылку на document.dispatchEvent
            const dispatchEvent = document.dispatchEvent.bind(document);

            // Оптимизированная функция для проверки стика
            function handleStickAxis(value, threshold, positiveKey, negativeKey) {
                const absValue = Math.abs(value);
                if (absValue >= threshold) {
                    const key = value > 0 ? negativeKey : positiveKey;
                    const events = keyboardEvents[key];
                    if (events && !pressedButtons.has(key)) {
                        pressedButtons.add(key);
                        dispatchEvent(events.down);
                    }
                } else {
                    if (keyboardEvents[positiveKey] && pressedButtons.has(positiveKey)) {
                        pressedButtons.delete(positiveKey);
                        dispatchEvent(keyboardEvents[positiveKey].up);
                    }
                    if (keyboardEvents[negativeKey] && pressedButtons.has(negativeKey)) {
                        pressedButtons.delete(negativeKey);
                        dispatchEvent(keyboardEvents[negativeKey].up);
                    }
                }
            }

            function pollGamepad() {
                if (!isPolling) return;

                const gamepads = navigator.getGamepads();
                const gamepad = gamepads[0]; // Обычно используется первый геймпад
                
                if (gamepad) {
                    // Обработка кнопок
                    const buttons = gamepad.buttons;
                    for (let i = 0; i < buttons.length; i++) {
                        const buttonCode = `button${i}`;
                        const events = keyboardEvents[buttonCode];
                        if (events) {
                            if (buttons[i].pressed && !pressedButtons.has(buttonCode)) {
                                pressedButtons.add(buttonCode);
                                dispatchEvent(events.down);
                            } else if (!buttons[i].pressed && pressedButtons.has(buttonCode)) {
                                pressedButtons.delete(buttonCode);
                                dispatchEvent(events.up);
                            }
                        }
                    }

                    // Обработка стиков
                    const axes = gamepad.axes;
                    handleStickAxis(axes[1], STICK_THRESHOLD, 'leftStickUp', 'leftStickDown');
                    handleStickAxis(axes[0], STICK_THRESHOLD, 'leftStickLeft', 'leftStickRight');
                    handleStickAxis(axes[3], STICK_THRESHOLD, 'rightStickUp', 'rightStickDown');
                    handleStickAxis(axes[2], STICK_THRESHOLD, 'rightStickLeft', 'rightStickRight');
                }

                requestAnimationFrame(pollGamepad);
            }

            function startGamepadPolling() {
                if (!isPolling) {
                    isPolling = true;
                    requestAnimationFrame(pollGamepad);
                }
            }

            function stopGamepadPolling() {
                if (isPolling) {
                    isPolling = false;
                    // Отпускаем все нажатые кнопки
                    for (const button of pressedButtons) {
                        const events = keyboardEvents[button];
                        if (events) {
                            dispatchEvent(events.up);
                        }
                    }
                    pressedButtons.clear();
                }
            }

            // Добавляем обработчики подключения/отключения геймпада
            window.addEventListener("gamepadconnected", startGamepadPolling);
            window.addEventListener("gamepaddisconnected", stopGamepadPolling);
        }

        // Функция для получения keyCode по code
        function getKeyCode(code) {
            const keyCodes = {
                // Буквы
                'KeyA': 65, 'KeyB': 66, 'KeyC': 67, 'KeyD': 68, 'KeyE': 69,
                'KeyF': 70, 'KeyG': 71, 'KeyH': 72, 'KeyI': 73, 'KeyJ': 74,
                'KeyK': 75, 'KeyL': 76, 'KeyM': 77, 'KeyN': 78, 'KeyO': 79,
                'KeyP': 80, 'KeyQ': 81, 'KeyR': 82, 'KeyS': 83, 'KeyT': 84,
                'KeyU': 85, 'KeyV': 86, 'KeyW': 87, 'KeyX': 88, 'KeyY': 89,
                'KeyZ': 90,

                // Цифры основной клавиатуры
                'Digit1': 49, 'Digit2': 50, 'Digit3': 51, 'Digit4': 52,
                'Digit5': 53, 'Digit6': 54, 'Digit7': 55, 'Digit8': 56,
                'Digit9': 57, 'Digit0': 48,

                // F-клавиши
                'F1': 112, 'F2': 113, 'F3': 114, 'F4': 115, 'F5': 116,
                'F6': 117, 'F7': 118, 'F8': 119, 'F9': 120, 'F10': 121,
                'F11': 122, 'F12': 123,

                // Специальные клавиши
                'Escape': 27,
                'Tab': 9,
                'CapsLock': 20,
                'ShiftLeft': 16,
                'ShiftRight': 16,
                'ControlLeft': 17,
                'ControlRight': 17,
                'AltLeft': 18,
                'AltRight': 18,
                'Space': 32,
                'Enter': 13,
                'Backspace': 8,
                'Delete': 46,
                'Insert': 45,
                'Home': 36,
                'End': 35,
                'PageUp': 33,
                'PageDown': 34,

                // Стрелки
                'ArrowUp': 38,
                'ArrowDown': 40,
                'ArrowLeft': 37,
                'ArrowRight': 39,

                // Символы
                'Minus': 189,
                'Equal': 187,
                'BracketLeft': 219,
                'BracketRight': 221,
                'Semicolon': 186,
                'Quote': 222,
                'Backslash': 220,
                'Comma': 188,
                'Period': 190,
                'Slash': 191,
                'Backquote': 192,

                // Нампад
                'NumLock': 144,
                'NumpadDivide': 111,
                'NumpadMultiply': 106,
                'NumpadSubtract': 109,
                'NumpadAdd': 107,
                'NumpadEnter': 13,
                'NumpadDecimal': 110,
                'Numpad0': 96,
                'Numpad1': 97,
                'Numpad2': 98,
                'Numpad3': 99,
                'Numpad4': 100,
                'Numpad5': 101,
                'Numpad6': 102,
                'Numpad7': 103,
                'Numpad8': 104,
                'Numpad9': 105
            };
            return keyCodes[code] || 0;
        }

        // Дефолтные настройки
        const defaultSettings = {
            renderAspect: "16/9",
            noCloud: true,
            backend: "dosbox",
            renderBackend: "webgl",
            backendLocked: false,
            mouseCapture: false,
            noCursor: false
        };

        // Функция для проверки наличия файла
        async function checkFileExists(url) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                return response.ok;
            } catch {
                return false;
            }
        }

        // Функция для сборки разделённых файлов
        async function assembleGameFile(basePath, fileName) {
            const loading = document.getElementById('loading');
            const loadingBackground = document.getElementById('loading-background');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const status = document.getElementById('status');
            
            loading.style.display = 'block';
            loadingBackground.style.display = 'block';
            loadingBackground.style.backgroundImage = `url('games/${basePath}/boxart.jpg')`;
            
            // Сначала находим все части и их размеры
            let partIndex = 1;
            const parts = [];
            let totalSize = 0;
            
            while (true) {
                const partUrl = `games/${basePath}/${fileName}_${partIndex}.jsdos`;
                const exists = await checkFileExists(partUrl);
                
                if (!exists) break;
                
                const response = await fetch(partUrl, { method: 'HEAD' });
                const size = parseInt(response.headers.get('content-length') || '0');
                parts.push({ url: partUrl, size });
                totalSize += size;
                partIndex++;
            }
            
            // Если нет частей, возвращаем null
            if (parts.length === 0) {
                loading.style.display = 'none';
                loadingBackground.style.display = 'none';
                return null;
            }

            // Загружаем все части
            const chunks = [];
            let loadedSize = 0;
            
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                status.textContent = `Загрузка части ${i + 1} из ${parts.length}...`;
                
                const response = await fetch(part.url);
                const reader = response.body.getReader();
                const partChunks = [];
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) break;
                    
                    partChunks.push(value);
                    loadedSize += value.length;
                    
                    // Обновляем общий прогресс
                    const progress = (loadedSize / totalSize) * 100;
                    progressFill.style.width = `${progress}%`;
                    progressText.textContent = `${Math.round(progress)}%`;
                }
                
                const blob = new Blob(partChunks);
                chunks.push(blob);
            }
            
            // Собираем финальный файл
            status.textContent = 'Сборка файла...';
            const assembledFile = new Blob(chunks, { type: 'application/octet-stream' });
            
            loading.style.display = 'none';
            loadingBackground.style.display = 'none';
            return assembledFile;
        }

        // Функция для проверки наличия файла в кэше эмулятора
        async function checkGameCache(gamePath) {
            return new Promise((resolve) => {
                const request = indexedDB.open('js-dos-cache (guest)', 1);  // Добавляем версию базы данных
                
                request.onerror = () => {
                    console.error("Error opening cache database");
                    resolve(false);
                };

                // Обработчик создания/обновления базы данных
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('files')) {
                        db.createObjectStore('files');
                    }
                };

                request.onsuccess = (event) => {
                    const db = event.target.result;
                    
                    // Проверяем существует ли хранилище
                    if (!db.objectStoreNames.contains('files')) {
                        console.log("Cache store not found");
                        resolve(false);
                        return;
                    }
                    
                    try {
                        const transaction = db.transaction(['files'], 'readonly');
                        const store = transaction.objectStore('files');
                        
                        const request = store.get(`games/${gamePath}/game.jsdos`);
                        
                        request.onsuccess = () => {
                            resolve(request.result !== undefined);
                        };
                        
                        request.onerror = () => {
                            console.error("Error reading from cache");
                            resolve(false);
                        };
                    } catch (error) {
                        console.error("Error accessing cache:", error);
                        resolve(false);
                    }
                };
            });
        }

        // Пытаемся загрузить пользовательские настройки
        fetch(`games/${gamePath}/settings.json`)
            .then(response => response.json())
            .catch(() => defaultSettings)
            .then(async customSettings => {
                // Объединяем дефолтные настройки с пользовательскими
                const settings = { ...defaultSettings, ...customSettings };
                
                // Путь к файлу игры и обложке
                const gamefile = `games/${gamePath}/game.jsdos`;
                const boxartfile = `games/${gamePath}/boxart.jpg`;

                // Проверяем, существует ли обычный файл
                const exists = await checkFileExists(gamefile);
                
                if (exists) {
                    // Если файл существует, запускаем как обычно
                    const props = Dos(document.getElementById("dos"), {
                        pathPrefix: "js-dos/emulators/",
                        background: boxartfile,
                        url: gamefile,
                        onEvent: (event, arg) => {
                            if (event === "fullscreen-change") {
                                if (arg === true) {
                                    props.setThinSidebar(false);
                                    // Блокируем клавишу Escape
                                    if (navigator.keyboard && navigator.keyboard.lock) {
                                        navigator.keyboard.lock(['Escape']).catch(error => {
                                            console.warn('Не удалось заблокировать клавишу Escape:', error);
                                        });
                                    }
                                } else {
                                    // Разблокируем клавиатуру при выходе из полноэкранного режима
                                    if (navigator.keyboard && navigator.keyboard.unlock) {
                                        navigator.keyboard.unlock();
                                    }
                                }
                            }
                        },
                        ...settings
                    });
                } else {
                    // Проверяем наличие игры в кэше
                    const inCache = await checkGameCache(gamePath);
                    
                    if (inCache) {
                        // Если игра в кэше, запускаем эмулятор как обычно
                        const props = Dos(document.getElementById("dos"), {
                            pathPrefix: "js-dos/emulators/",
                            background: boxartfile,
                            url: gamefile,
                            onEvent: (event, arg) => {
                                if (event === "fullscreen-change") {
                                    if (arg === true) {
                                        props.setThinSidebar(false);
                                        // Блокируем клавишу Escape
                                        if (navigator.keyboard && navigator.keyboard.lock) {
                                            navigator.keyboard.lock(['Escape']).catch(error => {
                                                console.warn('Не удалось заблокировать клавишу Escape:', error);
                                            });
                                        }
                                    } else {
                                        // Разблокируем клавиатуру при выходе из полноэкранного режима
                                        if (navigator.keyboard && navigator.keyboard.unlock) {
                                            navigator.keyboard.unlock();
                                        }
                                    }
                                }
                            },
                            ...settings
                        });
                    } else {
                        // Если игры нет в кэше, собираем файл из частей
                        const assembledFile = await assembleGameFile(gamePath, 'game');
                        
                        if (assembledFile) {
                            // Создаём URL для собранного файла
                            const fileUrl = URL.createObjectURL(assembledFile);
                            
                            // Создаём Response с собранным файлом
                            const response = new Response(assembledFile);
                            
                            // Перехватываем запросы к файлу игры
                            const originalFetch = window.fetch;
                            window.fetch = async function(url, options) {
                                if (url === gamefile) {
                                    return response.clone();
                                }
                                return originalFetch.apply(this, arguments);
                            };
                            
                            // Запускаем эмулятор с правильным URL
                            const props = Dos(document.getElementById("dos"), {
                                pathPrefix: "js-dos/emulators/",
                                background: boxartfile,
                                url: gamefile,
                                onEvent: (event, arg) => {
                                    if (event === "fullscreen-change") {
                                        if (arg === true) {
                                            props.setThinSidebar(false);
                                            // Блокируем клавишу Escape
                                            if (navigator.keyboard && navigator.keyboard.lock) {
                                                navigator.keyboard.lock(['Escape']).catch(error => {
                                                    console.warn('Не удалось заблокировать клавишу Escape:', error);
                                                });
                                            }
                                        } else {
                                            // Разблокируем клавиатуру при выходе из полноэкранного режима
                                            if (navigator.keyboard && navigator.keyboard.unlock) {
                                                navigator.keyboard.unlock();
                                            }
                                        }
                                    }
                                },
                                ...settings
                            });

                            // Восстанавливаем оригинальный fetch и освобождаем URL
                            props.onready = () => {
                                window.fetch = originalFetch;
                                URL.revokeObjectURL(fileUrl);
                            };
                        } else {
                            document.body.innerHTML = 'Error: Game file not found';
                            throw new Error('Game file not found');
                        }
                    }
                }
            });
    </script>
</body>
</html>
