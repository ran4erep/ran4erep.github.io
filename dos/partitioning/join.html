<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Joiner - ran4erep's DOS Games Library</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .joiner-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 10px;
        }

        .file-input-container {
            margin-bottom: 20px;
        }

        .file-input-label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .join-button {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: var(--custom-cursor), pointer;
        }

        .join-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: var(--secondary-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            margin-top: 10px;
            color: var(--text-color);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .selected-files {
            margin: 10px 0;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="joiner-container">
        <h2 style="color: var(--text-color); margin-bottom: 20px;">Объединение частей файла</h2>
        
        <div class="file-input-container">
            <label class="file-input-label">Выберите части файла:</label>
            <input type="file" id="fileInput" multiple accept=".jsdos" style="color: var(--text-color);">
            <div id="selectedFiles" class="selected-files"></div>
        </div>

        <button id="joinButton" class="join-button" disabled>Объединить файлы</button>

        <div id="progressContainer" class="progress-container">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const joinButton = document.getElementById('joinButton');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const status = document.getElementById('status');
        const selectedFiles = document.getElementById('selectedFiles');

        fileInput.addEventListener('change', () => {
            const files = Array.from(fileInput.files);
            joinButton.disabled = files.length === 0;
            
            if (files.length > 0) {
                // Сортируем файлы по номеру в конце имени
                files.sort((a, b) => {
                    const numA = parseInt(a.name.match(/_(\d+)\.jsdos$/)?.[1] || '0');
                    const numB = parseInt(b.name.match(/_(\d+)\.jsdos$/)?.[1] || '0');
                    return numA - numB;
                });

                // Показываем выбранные файлы
                selectedFiles.innerHTML = 'Выбранные файлы:<br>' + 
                    files.map(f => `• ${f.name}`).join('<br>');
            } else {
                selectedFiles.innerHTML = '';
            }
        });

        async function joinFiles() {
            try {
                const files = Array.from(fileInput.files).sort((a, b) => {
                    const numA = parseInt(a.name.match(/_(\d+)\.jsdos$/)?.[1] || '0');
                    const numB = parseInt(b.name.match(/_(\d+)\.jsdos$/)?.[1] || '0');
                    return numA - numB;
                });

                if (files.length === 0) return;

                joinButton.disabled = true;
                progressContainer.style.display = 'block';
                status.textContent = 'Начинаю объединение файлов...';

                // Читаем все файлы
                const totalFiles = files.length;
                const chunks = [];
                
                for (let i = 0; i < files.length; i++) {
                    status.textContent = `Чтение части ${i + 1} из ${totalFiles}...`;
                    const chunk = await files[i].arrayBuffer();
                    chunks.push(chunk);
                    
                    const progress = ((i + 1) / totalFiles) * 50; // Первые 50% прогресса
                    progressFill.style.width = progress + '%';
                }

                // Объединяем части
                status.textContent = 'Объединяю части...';
                const totalSize = chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);
                const result = new Uint8Array(totalSize);

                let offset = 0;
                for (let i = 0; i < chunks.length; i++) {
                    result.set(new Uint8Array(chunks[i]), offset);
                    offset += chunks[i].byteLength;

                    const progress = 50 + ((i + 1) / chunks.length) * 50; // Оставшиеся 50% прогресса
                    progressFill.style.width = progress + '%';
                }

                // Создаём и скачиваем объединённый файл
                const blob = new Blob([result], { type: 'application/octet-stream' });
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                
                // Берём имя из первого файла, убираем номер части и расширение
                const originalName = files[0].name.replace(/_\d+\.jsdos$/, '');
                a.download = `${originalName}.jsdos`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);

                status.textContent = 'Готово! Файл успешно собран и скачивание началось.';
                progressFill.style.width = '100%';
            } catch (error) {
                status.textContent = `Ошибка: ${error.message}`;
                progressFill.style.width = '0%';
            } finally {
                joinButton.disabled = false;
            }
        }

        joinButton.addEventListener('click', joinFiles);
    </script>
</body>
</html>
