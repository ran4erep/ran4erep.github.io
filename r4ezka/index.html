<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>R4ezka — Android-клиент Rezka</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Hero -->
        <header class="hero">
            <div class="hero-banner" style="background-image:url('images/banner.jpg')"></div>
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <img class="hero-icon" src="images/icon.png" alt="R4ezka" />
                <h1>R4ezka</h1>
                <p class="hero-sub">Неофициальный Android-клиент для сайта Rezka TV</p>
                <p class="hero-desc">
                    Удобный мобильный интерфейс для просмотра каталога, поиска фильмов и сериалов,
                    избранного и истории просмотра, а также встроенный видеоплеер.
                </p>
                <div class="hero-actions">
                    <a href="#" class="btn btn-primary" id="downloadBtn">
                        <span id="downloadLabel">Загрузка…</span>
                    </a>
                    <a href="https://github.com/ran4erep/R4ezka" target="_blank" rel="noopener noreferrer" class="btn btn-ghost">GitHub</a>
                </div>
            </div>
        </header>

        <!-- Скриншоты -->
        <section class="section">
            <h2>Скриншоты</h2>
            <div class="shots" id="shots">
                <!-- наполняется из images/screenshots/*.jpg -->
            </div>
        </section>

        <!-- Чейнджлог -->
        <section class="section">
            <h2>История версий</h2>
            <div class="changelog" id="changelog">
                <div class="placeholder">Загрузка чейнджлога…</div>
            </div>
        </section>

        <footer class="footer">
            R4ezka · by ran4erep
        </footer>
    </div>

    <div class="viewer" id="viewer" hidden>
        <button class="viewer-close" id="viewerClose" aria-label="Закрыть">&times;</button>
        <img id="viewerImg" src="" alt="" />
    </div>

    <script src="script.js"></script>
</body>
</html>
