name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Не тянем тяжёлые статические разделы (ROM-ы, mp3, wasm,
          # картинки, архивы) — они не нужны для сборки.
          # Список страниц (pages.json) генерируется из git-дерева,
          # поэтому отсутствие этих папок на диске не мешает.
          sparse-checkout: |
            /*
            !/gb
            !/nethack3d
            !/projects
            !/storm
            !/dead-storm
            !/bill
            !/arlade
            !/webrtc
            !/dos
            !/deadstorm
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: source/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('source/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build
        working-directory: source
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sync build output to site root
        run: |
          # Remove previous JS bundles from the site root so only the fresh
          # build remains (Vite emits assets/index-<hash>.js).
          rm -f assets/index-*.js
          rsync -a --exclude='.git' source/dist/ ./

      - name: Generate pages manifest
        run: node scripts/generate-pages.mjs

      - name: Commit & push rebuilt site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: rebuild site from source"
          git push origin master
