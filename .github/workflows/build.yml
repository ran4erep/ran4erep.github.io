name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Не тянем тяжёлые статические файлы (ROM-ы, mp3, wasm, картинки,
          # архивы) — они не нужны для сборки и никогда не меняются CI.
          # Полное дерево остаётся в репозитории и на GitHub Pages.
          sparse-checkout: |
            /*
            !/gb/roms
            !/gb/r4boy.png
            !/nethack3d/assets
            !/nethack3d/*.wasm
            !/nethack3d/fmod
            !/nethack3d/NetHack3D-splash.png
            !/nethack3d/NetHack3D.icns
            !/nethack3d/soundpacks/Default.soundpack.zip
            !/music
            !/fonts
            !/gallery
            !/storm/sounds
            !/storm/engine_vertical.mp4
            !/storm/engine.mp4
            !/storm/logo.png
            !/dead-storm/images/map.png
            !/dead-storm/images/npc.png
            !/bill/assets/index-C_dI83iC.js
            !/projects/games/hunter/libs/ruffle
            !/projects/games/opposite_reaction/game.apk
            !/projects/games/opposite_reaction/theme.ogg
            !/projects/games/cod_js/test.png
            !/projects/misc/wiki/dxwrapper.zip
            !/projects/misc/wiki/OblyTile.exe
            !/projects/misc/wiki/TileIconifier.exe
            !/projects/misc/wiki/start1.png
            !/projects/misc/wiki/start2.png
            !/projects/misc/wiki/dualboot.jpg
            !/projects/misc/wiki/re4.png
            !/projects/misc/wiki/tmpkeyboard.png
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build
        working-directory: source
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sync build output to site root
        run: |
          # Remove previous JS bundles from the site root so only the fresh
          # build remains (Vite emits assets/index-<hash>.js).
          rm -f assets/index-*.js
          rsync -a --exclude='.git' source/dist/ ./

      - name: Generate pages manifest
        run: node scripts/generate-pages.mjs

      - name: Commit & push rebuilt site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: rebuild site from source"
          git push origin master
