name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: source/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('source/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build
        working-directory: source
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate pages manifest
        run: node scripts/generate-pages.mjs

      - name: Update media indexes
        timeout-minutes: 10
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          fi
          node scripts/update-media.mjs

      - name: Commit media index changes
        run: |
          if git diff --quiet -- gallery/gallery.json gallery music/playlist.json music; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/gallery.json gallery music/playlist.json music
          git commit -m "chore: update media indexes"
          git push

      - name: Stage site for Pages
        run: |
          # Собираем полный снимок сайта: репозиторий (статические
          # разделы) + свежая сборка Vite поверх.
          rm -rf _site && mkdir _site
          rsync -a --exclude='.git' --exclude='source' --exclude='scripts' \
                --exclude='.github' --exclude='node_modules' --exclude='_site' \
                ./ _site/
          rm -f _site/assets/index-*.js
          rsync -a source/dist/ _site/

      - name: Restore media indexes into staged site
        run: |
          # source/public/ содержит собственные копии gallery.json и playlist.json
          # (они нужны Vite в dev-режиме), и при наложении source/dist/ они
          # перекрывают свежие корневые версии, которые обновил update-media.
          # Возвращаем в собранный сайт корневые (актуальные) индексы.
          cp gallery/gallery.json _site/gallery/gallery.json
          cp music/playlist.json _site/music/playlist.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
