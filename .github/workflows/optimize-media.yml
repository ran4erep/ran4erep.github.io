name: Optimize media

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-media
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          fi

      - name: Optimize all gallery images
        run: node scripts/update-media.mjs --all

      - name: Commit changes
        run: |
          if git diff --quiet -- gallery/gallery.json gallery music/playlist.json music; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/gallery.json gallery music/playlist.json music
          git commit -m "chore: optimize media (--all)"
          git push
