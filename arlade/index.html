<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arlade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="src/rendering/glyphs.js"></script>
    <script src="src/systems/vision.js"></script>
    <script src="src/ui/HUD.js"></script>
    <script src="src/ui/ContextMenu.js"></script>
    <script src="src/ui/DebugMenu.js"></script>
    <script src="src/systems/input.js"></script>
    <script src="src/rendering/camera.js"></script>
    <script src="src/rendering/renderer.js"></script>
    <script src="src/systems/collision.js"></script>
    <script src="src/systems/enemies.js"></script>
    <script src="src/core/game.js"></script>
</body>
</html>
