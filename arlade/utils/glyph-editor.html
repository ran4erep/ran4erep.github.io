<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glyph Editor</title>
    <style>
        :root {
            --bg-main: #1E1E2E;
            --bg-editor: #2A2A3A;
            --bg-transparent: #353545;
            --bg-controls: #2A2A3A;
            --text-color: #f2f2f9;
            --accent-color: #6a5fa0;
            --border-color: #353545;
            --grid-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background-color: var(--bg-main);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 500;
        }

        .name-input {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .name-input input,
        .name-input select {
            background: var(--bg-editor);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 6px;
            width: 200px;
        }

        .name-input select {
            cursor: pointer;
        }

        .name-input select option {
            background: var(--bg-editor);
            color: var(--text-color);
            padding: 8px;
        }

        .container {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .editor-container {
            background: var(--bg-editor);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .editor {
            display: grid;
            grid-template-columns: repeat(16, 25px);
            gap: 1px;
            background: var(--border-color);
            padding: 1px;
            border-radius: 4px;
            position: relative;
            width: fit-content;
        }

        .editor::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 26px 26px;
            background-position: 1px 1px;
            pointer-events: none;
            z-index: 1;
            border-radius: 4px;
        }

        .pixel {
            width: 25px;
            height: 25px;
            background: var(--bg-transparent);
            cursor: crosshair;
            border-radius: 0;
            transition: transform 0.1s;
            position: relative;
            z-index: 0;
        }

        .pixel:hover {
            transform: none;
            filter: brightness(1.2);
        }

        .palette-container {
            background: var(--bg-editor);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(4, 30px);
            gap: 8px;
        }

        .color {
            width: 30px;
            height: 30px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color:hover {
            transform: scale(1.1);
        }

        .color.selected {
            border-color: var(--text-color) !important;
            transform: scale(1.1);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: var(--accent-color);
            border: none;
            color: var(--text-color);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            transition: background-color 0.2s, transform 0.1s;
            position: relative;
        }

        button.active {
            background: #7a6eb0;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #7a6eb0;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .output {
            background: var(--bg-editor);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .output-header button {
            padding: 8px 16px;
            background: var(--accent-color);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .output-header button:hover {
            background: color-mix(in srgb, var(--accent-color) 80%, white);
        }

        .output pre {
            margin: 0;
            white-space: pre-wrap;
            font-size: 14px;
            color: #26dddd;
        }

        .section-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .preview-pixel {
            position: absolute;
            width: 25px;
            height: 25px;
            background: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Glyph Editor</h1>
            <div class="name-input">
                <input type="text" id="glyphName" value="new_glyph" placeholder="Enter glyph name...">
                <select id="existingGlyphs" onchange="loadExistingGlyph()">
                    <option value="">Load existing glyph...</option>
                </select>
            </div>
        </div>

        <div class="container">
            <div class="editor-container">
                <div class="section-title">Drawing Area</div>
                <div class="editor" id="editor"></div>
                <div class="controls">
                    <button onclick="clearEditor()">Clear</button>
                    <button onclick="toggleFillMode()" id="fillButton">Fill (F)</button>
                    <button onclick="undo()" id="undoButton" disabled>Undo (Ctrl+Z)</button>
                    <button onclick="toggleCircleMode()" id="circleButton">Circle (C)</button>
                </div>
            </div>
            <div class="palette-container">
                <div class="section-title">Color Palette</div>
                <div class="palette" id="palette"></div>
            </div>
        </div>

        <div class="output">
            <div class="output-header">
                <div class="section-title">Generated Code</div>
                <button onclick="copyToClipboard()">Copy JSON</button>
            </div>
            <pre id="output"></pre>
        </div>
    </div>

    <script>
        const COLORS = [
            '#000000', // Black
            '#FFFFFF', // White
            '#FF0000', // Red
            '#00FF00', // Green
            '#0000FF', // Blue
            '#FF00FF', // Magenta
            '#FFFF00', // Yellow
            '#00FFFF', // Cyan
            '#FF8000', // Orange
            '#800000', // Dark Red
            '#008000', // Dark Green
            '#000080', // Dark Blue
            '#800080', // Dark Magenta
            '#808000', // Dark Yellow
            '#008080', // Dark Cyan
            '#808080', // Gray
            '#d82323', // Bright Red
            '#98183c', // Deep Red
            '#1867a0', // Ocean Blue
            '#934226', // Rust Brown
            '#6c251e', // Dark Brown
            '#6a5fa0', // Purple
            '#f2c0a2', // Skin
            '#161423'  // Dark Navy
        ];

        let selectedColor = 'A';
        const grid = Array(16).fill().map(() => Array(16).fill('-'));
        
        // История действий для отмены
        const history = [];
        let isUndoing = false;
        let isDrawing = false;
        let hasChanges = false;
        let lastDrawPosition = null;
        let isCircleMode = false;
        let circleStart = null;
        let previewElement = null;
        let isFillMode = false;

        function saveState() {
            if (isUndoing) return;
            const state = grid.map(row => [...row]);
            history.push(state);
            document.getElementById('undoButton').disabled = false;
            if (history.length > 50) history.shift(); // Ограничиваем историю 50 действиями
        }

        function undo() {
            if (history.length === 0) return;
            
            isUndoing = true;
            const previousState = history.pop();
            
            // Восстанавливаем предыдущее состояние
            for (let y = 0; y < 16; y++) {
                for (let x = 0; x < 16; x++) {
                    grid[y][x] = previousState[y][x];
                    const pixel = document.querySelector(`.pixel[data-x="${x}"][data-y="${y}"]`);
                    if (previousState[y][x] === '-') {
                        pixel.style.background = 'var(--bg-transparent)';
                    } else {
                        const colorIndex = previousState[y][x].charCodeAt(0) - 65;
                        pixel.style.background = COLORS[colorIndex];
                    }
                }
            }

            document.getElementById('undoButton').disabled = history.length === 0;
            updateOutput();
            isUndoing = false;
        }
        
        function initEditor() {
            const editor = document.getElementById('editor');
            const palette = document.getElementById('palette');

            // Создаем сетку редактора
            for (let y = 0; y < 16; y++) {
                for (let x = 0; x < 16; x++) {
                    const pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    pixel.dataset.x = x;
                    pixel.dataset.y = y;
                    // Отключаем drag'n'drop
                    pixel.draggable = false;
                    pixel.addEventListener('mousedown', (e) => {
                        e.preventDefault(); // Предотвращаем drag'n'drop
                        startDrawing(e);
                    });
                    pixel.addEventListener('mouseover', continueDrawing);
                    pixel.addEventListener('mousemove', updatePreview);
                    editor.appendChild(pixel);
                }
            }

            // Добавляем обработчики окончания рисования на window
            window.addEventListener('mouseup', stopDrawing);
            window.addEventListener('blur', stopDrawing);
            
            // Добавляем обработчик движения мыши для всего редактора
            editor.addEventListener('mousemove', (e) => {
                if (e.target.classList.contains('pixel')) {
                    updatePreview(e);
                }
            });
            
            // Отключаем выделение текста при рисовании
            editor.addEventListener('selectstart', (e) => e.preventDefault());
            
            // Отключаем контекстное меню на редакторе
            editor.addEventListener('contextmenu', (e) => e.preventDefault());

            // Создаем палитру
            // Добавляем прозрачный цвет
            const transparentColor = document.createElement('div');
            transparentColor.className = 'color';
            transparentColor.style.background = `
                repeating-conic-gradient(
                    var(--bg-transparent) 0% 25%,
                    var(--bg-editor) 0% 50%
                ) 50% / 8px 8px
            `;
            transparentColor.style.border = '2px solid var(--border-color)';
            transparentColor.addEventListener('click', () => selectColor('-'));
            palette.appendChild(transparentColor);

            // Добавляем цвета
            COLORS.forEach((color, index) => {
                const colorEl = document.createElement('div');
                colorEl.className = 'color' + (index === 0 ? ' selected' : '');
                colorEl.style.backgroundColor = color;
                colorEl.addEventListener('click', () => selectColor(String.fromCharCode(65 + index)));
                palette.appendChild(colorEl);
            });

            // Добавляем обработчики клавиш
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Shift') {
                    editor.classList.add('shift-pressed');
                } else if (e.key === 'Escape') {
                    if (isCircleMode) {
                        circleStart = null;
                    }
                    if (isFillMode) {
                        toggleFillMode();
                    }
                    lastDrawPosition = null;
                    removePreview();
                } else if (e.key.toLowerCase() === 'c') {
                    toggleCircleMode();
                } else if (e.key.toLowerCase() === 'f') {
                    toggleFillMode();
                } else if (e.key.toLowerCase() === 'e') {
                    selectColor('-');
                } else if (e.ctrlKey && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.key === 'Shift') {
                    editor.classList.remove('shift-pressed');
                    if (!isDrawing) {
                        removePreview();
                    }
                }
            });

            updateOutput();
            saveState();
        }

        function selectColor(color) {
            selectedColor = color;
            document.querySelectorAll('.color').forEach(el => el.classList.remove('selected'));
            if (color === '-') {
                document.querySelector('.color').classList.add('selected');
            } else {
                document.querySelectorAll('.color')[color.charCodeAt(0) - 64].classList.add('selected');
            }
        }

        function createPreviewElement() {
            if (!previewElement) {
                previewElement = document.createElement('div');
                previewElement.className = 'preview-pixel';
                document.querySelector('.editor').appendChild(previewElement);
            }
            return previewElement;
        }

        function removePreview() {
            const editor = document.querySelector('.editor');
            editor.querySelectorAll('.preview-pixel').forEach(el => el.remove());
        }

        function toggleCircleMode() {
            isCircleMode = !isCircleMode;
            const circleButton = document.getElementById('circleButton');
            circleButton.classList.toggle('active', isCircleMode);
            if (isCircleMode) {
                circleButton.textContent = 'Circle Mode (C) ●';
                document.body.style.cursor = 'crosshair';
            } else {
                circleButton.textContent = 'Circle (C)';
                document.body.style.cursor = '';
                circleStart = null;
                removePreview();
            }
        }

        function toggleFillMode() {
            isFillMode = !isFillMode;
            isCircleMode = false; // Выключаем режим окружности при включении заливки
            const fillButton = document.getElementById('fillButton');
            const circleButton = document.getElementById('circleButton');
            
            fillButton.classList.toggle('active', isFillMode);
            circleButton.classList.remove('active');
            
            if (isFillMode) {
                fillButton.textContent = 'Fill Mode (F) ●';
                document.body.style.cursor = 'crosshair';
            } else {
                fillButton.textContent = 'Fill (F)';
                document.body.style.cursor = '';
            }
            
            circleStart = null;
            removePreview();
        }

        function drawLine(x1, y1, x2, y2) {
            const points = [];
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);
            const sx = (x1 < x2) ? 1 : -1;
            const sy = (y1 < y2) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                points.push({x: x1, y: y1});
                if (x1 === x2 && y1 === y2) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x1 += sx; }
                if (e2 < dx) { err += dx; y1 += sy; }
            }
            return points;
        }

        function drawCircle(x0, y0, x1, y1) {
            const points = new Set();
            const radius = Math.round(Math.sqrt(Math.pow(x1 - x0, 2) + Math.pow(y1 - y0, 2)));
            let x = radius, y = 0;
            let radiusError = 1 - x;

            while (x >= y) {
                points.add(`${x + x0},${y + y0}`);
                points.add(`${y + x0},${x + y0}`);
                points.add(`${-x + x0},${y + y0}`);
                points.add(`${-y + x0},${x + y0}`);
                points.add(`${-x + x0},${-y + y0}`);
                points.add(`${-y + x0},${-x + y0}`);
                points.add(`${x + x0},${-y + y0}`);
                points.add(`${y + x0},${-x + y0}`);
                y++;
                
                if (radiusError < 0) {
                    radiusError += 2 * y + 1;
                } else {
                    x--;
                    radiusError += 2 * (y - x + 1);
                }
            }

            return Array.from(points).map(p => {
                const [px, py] = p.split(',').map(Number);
                return {x: px, y: py};
            }).filter(p => 
                p.x >= 0 && p.x < 16 && p.y >= 0 && p.y < 16
            );
        }

        function showPreview(points) {
            const editor = document.querySelector('.editor');
            // Удаляем все предыдущие превью
            editor.querySelectorAll('.preview-pixel').forEach(el => el.remove());
            
            points.forEach(({x, y}) => {
                const preview = document.createElement('div');
                preview.className = 'preview-pixel';
                preview.style.left = `${x * 26 + 1}px`;
                preview.style.top = `${y * 26 + 1}px`;
                editor.appendChild(preview);
            });
        }

        function startDrawing(e) {
            if (e.button !== 0) return;
            const x = parseInt(e.target.dataset.x);
            const y = parseInt(e.target.dataset.y);

            if (isFillMode) {
                const targetColor = grid[y][x];
                saveState();
                floodFill(x, y, targetColor, selectedColor);
                updateOutput();
                return;
            }

            if (isCircleMode) {
                if (!circleStart) {
                    circleStart = {x, y};
                    showPreview([{x, y}]);
                } else {
                    const points = drawCircle(circleStart.x, circleStart.y, x, y);
                    saveState();
                    points.forEach(p => {
                        const pixel = document.querySelector(`.pixel[data-x="${p.x}"][data-y="${p.y}"]`);
                        if (pixel) {
                            grid[p.y][p.x] = selectedColor;
                            if (selectedColor === '-') {
                                pixel.style.background = 'var(--bg-transparent)';
                            } else {
                                const colorIndex = selectedColor.charCodeAt(0) - 65;
                                pixel.style.background = COLORS[colorIndex];
                            }
                        }
                    });
                    updateOutput();
                    circleStart = null; // Сбрасываем начальную точку
                    removePreview(); // Убираем предпросмотр
                }
                return;
            }

            if (e.shiftKey && lastDrawPosition) {
                const points = drawLine(
                    lastDrawPosition.x,
                    lastDrawPosition.y,
                    x, y
                );
                saveState();
                points.forEach(p => {
                    const pixel = document.querySelector(`.pixel[data-x="${p.x}"][data-y="${p.y}"]`);
                    if (pixel) {
                        grid[p.y][p.x] = selectedColor;
                        if (selectedColor === '-') {
                            pixel.style.background = 'var(--bg-transparent)';
                        } else {
                            const colorIndex = selectedColor.charCodeAt(0) - 65;
                            pixel.style.background = COLORS[colorIndex];
                        }
                    }
                });
                updateOutput();
                removePreview();
            } else {
                isDrawing = true;
                hasChanges = false;
                paintPixel(e);
            }
            
            lastDrawPosition = {x, y};
        }

        function continueDrawing(e) {
            const x = parseInt(e.target.dataset.x);
            const y = parseInt(e.target.dataset.y);

            if (!isDrawing) {
                if (isCircleMode && circleStart) {
                    const points = drawCircle(circleStart.x, circleStart.y, x, y);
                    showPreview(points);
                } else if (e.shiftKey && lastDrawPosition) {
                    const points = drawLine(
                        lastDrawPosition.x,
                        lastDrawPosition.y,
                        x, y
                    );
                    showPreview(points);
                }
                return;
            }

            if (!e.shiftKey) {
                paintPixel(e);
                lastDrawPosition = {x, y};
            }
        }

        function stopDrawing(e) {
            if (!isDrawing && !isCircleMode) {
                if (!e?.shiftKey) {
                    removePreview();
                }
            }
            if (!isDrawing) return;
            isDrawing = false;
            hasChanges = false;
            lastDrawPosition = null;
        }

        function paintPixel(e) {
            const x = e.target.dataset.x;
            const y = e.target.dataset.y;
            
            if (!hasChanges && grid[y][x] !== selectedColor) {
                saveState();
                hasChanges = true;
            }

            if (grid[y][x] !== selectedColor) {
                grid[y][x] = selectedColor;
                
                if (selectedColor === '-') {
                    e.target.style.background = 'var(--bg-transparent)';
                } else {
                    const colorIndex = selectedColor.charCodeAt(0) - 65;
                    e.target.style.background = COLORS[colorIndex];
                }
                
                updateOutput();
            }
        }

        function clearEditor() {
            saveState();
            grid.forEach(row => row.fill('-'));
            document.querySelectorAll('.pixel').forEach(pixel => {
                pixel.style.background = 'var(--bg-transparent)';
            });
            updateOutput();
        }

        function fillTransparent() {
            saveState();
            grid.forEach(row => row.fill('-'));
            document.querySelectorAll('.pixel').forEach(pixel => {
                pixel.style.background = 'var(--bg-transparent)';
            });
            updateOutput();
        }

        function updateOutput() {
            const name = document.getElementById('glyphName').value;
            const usedColors = new Set(grid.flat().filter(c => c !== '-'));
            
            const colorEntries = Array.from(usedColors).map(color => 
                `            "${color}": "${COLORS[color.charCodeAt(0) - 65]}"`
            ).join(',\n');

            const pixels = grid.map(row => 
                `            "${row.join('')}"`
            ).join(',\n');

            const output = `    "${name}": {
        "pixels": [
${pixels}
        ],
        "colors": {
${colorEntries}
        }
    }`;

            document.getElementById('output').textContent = output;
        }

        document.getElementById('glyphName').addEventListener('input', updateOutput);

        // Инициализация при загрузке
        initEditor();
        loadGlyphs();

        async function loadGlyphs() {
            try {
                const response = await fetch('../src/data/glyphs.json');
                const glyphs = await response.json();
                const select = document.getElementById('existingGlyphs');
                
                // Очищаем старые опции, оставляя только первую
                while (select.options.length > 1) {
                    select.remove(1);
                }
                
                // Добавляем глифы в селект
                Object.keys(glyphs).forEach(glyphName => {
                    const option = document.createElement('option');
                    option.value = glyphName;
                    option.textContent = glyphName;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load glyphs:', error);
            }
        }

        async function loadExistingGlyph() {
            const select = document.getElementById('existingGlyphs');
            const glyphName = select.value;
            
            if (!glyphName) return;
            
            try {
                const response = await fetch('../src/data/glyphs.json');
                const glyphs = await response.json();
                const glyph = glyphs[glyphName];
                
                if (!glyph) return;
                
                // Сохраняем текущее состояние перед загрузкой
                saveState();
                
                // Обновляем имя глифа
                document.getElementById('glyphName').value = glyphName;
                
                // Очищаем сетку
                grid.forEach(row => row.fill('-'));
                
                // Заполняем сетку данными глифа
                glyph.pixels.forEach((row, y) => {
                    for (let x = 0; x < row.length; x++) {
                        grid[y][x] = row[x];
                        const pixel = document.querySelector(`.pixel[data-x="${x}"][data-y="${y}"]`);
                        if (row[x] === '-') {
                            pixel.style.background = 'var(--bg-transparent)';
                        } else {
                            const colorIndex = row[x].charCodeAt(0) - 65;
                            pixel.style.background = COLORS[colorIndex];
                        }
                    }
                });
                
                // Обновляем вывод
                updateOutput();
                
                // Сбрасываем селект
                select.value = '';
                
            } catch (error) {
                console.error('Failed to load glyph:', error);
            }
        }

        function updatePreview(e) {
            const x = parseInt(e.target.dataset.x);
            const y = parseInt(e.target.dataset.y);
            
            if (!isNaN(x) && !isNaN(y)) {
                if (isCircleMode && circleStart) {
                    const points = drawCircle(circleStart.x, circleStart.y, x, y);
                    showPreview(points);
                } else if (e.shiftKey && lastDrawPosition && !isCircleMode) {
                    const points = drawLine(
                        lastDrawPosition.x,
                        lastDrawPosition.y,
                        x, y
                    );
                    showPreview(points);
                }
            }
        }

        function floodFill(startX, startY, targetColor, replacementColor) {
            if (targetColor === replacementColor) return;
            
            const stack = [{x: startX, y: startY}];
            const visited = new Set();
            
            while (stack.length > 0) {
                const {x, y} = stack.pop();
                const key = `${x},${y}`;
                
                if (visited.has(key)) continue;
                if (x < 0 || x >= 16 || y < 0 || y >= 16) continue;
                if (grid[y][x] !== targetColor) continue;
                
                visited.add(key);
                
                // Закрашиваем текущий пиксель
                grid[y][x] = replacementColor;
                const pixel = document.querySelector(`.pixel[data-x="${x}"][data-y="${y}"]`);
                if (replacementColor === '-') {
                    pixel.style.background = 'var(--bg-transparent)';
                } else {
                    const colorIndex = replacementColor.charCodeAt(0) - 65;
                    pixel.style.background = COLORS[colorIndex];
                }
                
                // Добавляем соседние пиксели
                stack.push({x: x + 1, y: y});
                stack.push({x: x - 1, y: y});
                stack.push({x: x, y: y + 1});
                stack.push({x: x, y: y - 1});
            }
        }

        function copyToClipboard() {
            const output = document.getElementById('output');
            navigator.clipboard.writeText(output.textContent)
                .then(() => alert('Copied to clipboard!'))
                .catch(err => console.error('Failed to copy:', err));
        }
    </script>
