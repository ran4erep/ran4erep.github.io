<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="game-area">
                <div id="game-board"></div>
            </div>
            <div class="info-panel">
                <h2>&#128013; Snake AI</h2>
                <div class="score-box">
                    <p>Очки: <span id="score">0</span></p>
                    <p>Рекорд: <span id="high-score">0</span></p>
                    <p>Средний показатель: <span id="average-score">0</span></p>
                </div>
                <div class="stats">
                    <p>Итераций: <span id="games-played">0</span></p>
                    <p>Эпсилон: <span id="epsilon">1.00</span></p>
                </div>
                <div class="controls">
                    <button id="save-model">Сохранить модель</button>
                    <button id="load-model">Загрузить модель</button>
                </div>
                <div class="speed-control">
                    <div class="speed-header">
                        <label for="speed-slider">Скорость игры</label>
                        <span id="speed-value">50</span>
                    </div>
                    <input type="range" id="speed-slider" min="1" max="300" value="50">
                </div>
            </div>
            <div class="chart-panel">
                <canvas id="progress-chart" width="400" height="200"></canvas>
            </div>
        </div>
        <div class="game-log-panel">
            <div class="game-log-container">
                <textarea id="game-log" readonly></textarea>
                <div class="scrollbar-track">
                    <div class="scrollbar-thumb"></div>
                </div>
            </div>
            <button id="copy-log" class="icon-button" title="Копировать лог">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M20 9H11C9.89543 9 9 9.89543 9 11V20C9 21.1046 9.89543 22 11 22H20C21.1046 22 22 21.1046 22 20V11C22 9.89543 21.1046 9 20 9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 15H4C3.46957 15 2.96086 14.7893 2.58579 14.4142C2.21071 14.0391 2 13.5304 2 13V4C2 3.46957 2.21071 2.96086 2.58579 2.58579C2.96086 2.21071 3.46957 2 4 2H13C13.5304 2 14.0391 2.21071 14.4142 2.58579C14.7893 2.96086 15 3.46957 15 4V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="copy-tooltip">Скопировано!</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="script.js"></script>
</body>
</html>
