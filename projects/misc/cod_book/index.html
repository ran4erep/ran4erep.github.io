<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f15">
    <title>Cradle of Death — Колыбель смерти</title>
    <link rel="icon" type="image/jpeg" href="cover.jpg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="topbar" id="topbar">
            <div class="brand"><span class="dot"></span>Cradle of Death</div>
            <div class="spacer"></div>
            <button class="btn iconbtn" id="prevBtn" aria-label="Назад" title="Назад (←)">‹</button>
            <span class="pageinfo" id="pageInfo">—</span>
            <button class="btn iconbtn" id="nextBtn" aria-label="Вперёд" title="Вперёд (→)">›</button>
            <select class="btn jump hide-m" id="jump" title="Перейти к странице"></select>
            <button class="btn iconbtn hide-m" id="fsBtn" aria-label="Во весь экран" title="Во весь экран (F)">⛶</button>
        </header>

        <main class="stage" id="stage">
            <div class="book" id="book"></div>
            <div class="hint" id="hint">← → листают, пробел — вперёд, свайп по краям тоже работает</div>
        </main>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loadmsg" id="loadMsg">Загрузка книги…</div>
        <div class="pbar"><i id="pbarFill"></i></div>
    </div>

    <noscript>Для чтения книги нужен включённый JavaScript.</noscript>

    <script type="module" src="script.js"></script>
</body>
</html>
