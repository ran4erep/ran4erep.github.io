        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        #container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container ruffle-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #joystick {
            position: absolute;
            bottom: 10%;
            left: 3%;
            width: 120px;
            height: 120px;
            z-index: 10;
        }
        .button-container {
            position: absolute;
            bottom: 10%;
            right: 3%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .touch-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .touch-button.active {
            background-color: rgba(0, 0, 0, 0.9);
        }
        .touch-button svg {
            width: 30px;
            height: 30px;
            fill: white;
        }
    </style>

    <script>
        // Инициализация Ruffle
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        document.getElementById("container").appendChild(player);
        player.load({
            url: "swf/hunter.swf",
            autoplay: "on",
			scale: "exactFit",
			quality: "high"
        }).catch(error => {
            console.error("Error loading SWF:", error);
        });

        // Установка фокуса на плеер
        player.focus();

        // Функция для отправки событий клавиатуры
        function simulateKey(keyCode, type) {
            const keyMap = {
                32: { key: ' ', code: 'Space' },
                17: { key: 'Control', code: 'ControlLeft' },
                37: { key: 'ArrowLeft', code: 'ArrowLeft' },
                38: { key: 'ArrowUp', code: 'ArrowUp' },
                39: { key: 'ArrowRight', code: 'ArrowRight' },
                40: { key: 'ArrowDown', code: 'ArrowDown' }
            };
            const event = new KeyboardEvent(type, {
                key: keyMap[keyCode]?.key || '',
                code: keyMap[keyCode]?.code || '',
                keyCode: keyCode,
                bubbles: true,
                cancelable: true
            });
            player.dispatchEvent(event);
            document.dispatchEvent(event);
            window.dispatchEvent(event);
        }

        // Инициализация джойстика
        const joystick = nipplejs.create({
            zone: document.getElementById('joystick'),
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: 'white',
            size: 100
        });

        // Текущие активные клавиши
        const activeKeys = new Set();

        joystick.on('move', (evt, data) => {
            activeKeys.clear();
            const angle = data.angle.degree;
            if (angle >= 45 && angle < 135) {
                activeKeys.add(38); // ArrowUp
            } else if (angle >= 135 && angle < 225) {
                activeKeys.add(37); // ArrowLeft
            } else if (angle >= 225 && angle < 315) {
                activeKeys.add(40); // ArrowDown
            } else if (angle >= 315 || angle < 45) {
                activeKeys.add(39); // ArrowRight
            }
            activeKeys.forEach(key => simulateKey(key, 'keydown'));
        });

        joystick.on('end', () => {
            activeKeys.forEach(key => simulateKey(key, 'keyup'));
            activeKeys.clear();
        });

        // Обработка кнопок
        const fireButton = document.getElementById('fire-button');
        const reloadButton = document.getElementById('reload-button');

        function handleButton(button, keyCode, isActive) {
            if (isActive) {
                button.classList.add('active');
                simulateKey(keyCode, 'keydown');
            } else {
                button.classList.remove('active');
                simulateKey(keyCode, 'keyup');
            }
        }

        fireButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleButton(fireButton, 32, true);
        });
        fireButton.addEventListener('touchend', (e) => {
            e.preventDefault();
            handleButton(fireButton, 32, false);
        });

        reloadButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleButton(reloadButton, 17, true);
        });
        reloadButton.addEventListener('touchend', (e) => {
            e.preventDefault();
            handleButton(reloadButton, 17, false);
        });

        // Поддержка мыши
        fireButton.addEventListener('mousedown', () => handleButton(fireButton, 32, true));
        fireButton.addEventListener('mouseup', () => handleButton(fireButton, 32, false));
        reloadButton.addEventListener('mousedown', () => handleButton(reloadButton, 17, true));
        reloadButton.addEventListener('mouseup', () => handleButton(reloadButton, 17, false));

        // Проверка фокуса при клике на документ
        document.addEventListener('click', () => {
            player.focus();
        });
    </script>
